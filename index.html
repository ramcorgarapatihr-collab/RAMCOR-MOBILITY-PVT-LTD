<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>రామ్‌కార్ మొబిలిటీ — ఐచర్ ప్రో X సేల్స్ ఇంటర్వ్యూ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1b17;
    --ink-soft:#5b5849;
    --paper:#faf7f0;
    --paper-raised:#ffffff;
    --line:#ddd6c4;
    --rust:#c8202f;
    --rust-deep:#9a1722;
    --olive:#16356b;
    --olive-deep:#102a57;
    --mustard:#c98a1f;
    --danger:#a3342b;
    --danger-bg:#f6e8e4;
    --success:#3c6b3f;
    --success-bg:#e9f0e4;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,27,23,0.06), 0 4px 16px rgba(28,27,23,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 20px 80px;}
  .brandbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0 20px;border-bottom:2px solid var(--ink);margin-bottom:28px;
  }
  .brandbar .mark{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
  .brandbar .logo{height:46px;width:auto;mix-blend-mode:multiply;display:block;}
  .brandbar .mark .dot{width:10px;height:10px;background:var(--rust);border-radius:2px;transform:rotate(45deg);}
  .brandbar h1{font-size:15px;font-weight:700;letter-spacing:0.02em;margin:0;text-transform:uppercase;}
  .brandbar .tag{font-size:11px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;}
  .brandbar .owner-link{font-size:11px;color:var(--ink-soft);text-decoration:none;letter-spacing:0.03em;cursor:pointer;border:none;background:none;font-family:inherit;}
  .brandbar .owner-link:hover{color:var(--rust);}

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 26px;
    box-shadow:var(--shadow);
  }
  .eyebrow{
    font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--rust-deep);margin:0 0 8px;
  }
  h2{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin:18px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=tel], select, textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:7px;
    font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(200,32,47,0.14);
  }
  textarea{resize:vertical;min-height:90px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:540px){.row2{grid-template-columns:1fr;}}

  .photo-zone{
    border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;
    cursor:pointer;background:var(--paper);transition:border-color .15s;
  }
  .photo-zone:hover{border-color:var(--rust);}
  .photo-zone img{max-width:120px;max-height:120px;border-radius:8px;object-fit:cover;}
  .photo-zone .hint{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:7px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:transform .08s, opacity .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--rust);color:#fff;}
  .btn-primary:hover{background:var(--rust-deep);}
  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-block{width:100%;margin-top:24px;padding:14px;font-size:16px;}

  .progress-rail{display:flex;gap:5px;margin-bottom:22px;}
  .progress-seg{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-seg.done{background:var(--olive);}
  .progress-seg.active{background:var(--mustard);}

  .qcat{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;padding:4px 9px;border-radius:5px;margin-bottom:12px;
  }
  .qcat.logic{background:#e8e3f5;color:#4d3c8a;}
  .qcat.product{background:#e3e9f4;color:var(--olive-deep);}
  .qcat.sales{background:#f6e8da;color:var(--rust-deep);}
  .qcat.situational{background:#f5e9d8;color:#8a5a14;}
  .qcat.communication{background:#e3eef2;color:#2c5a6b;}

  .qtext{font-size:18px;font-weight:600;line-height:1.45;margin:0 0 18px;}

  .loading-row{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:14px;padding:18px 0;}
  .spinner{
    width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--rust);
    border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .center-pad{text-align:center;padding:50px 20px;}
  .center-pad .spinner{margin:0 auto 16px;width:24px;height:24px;border-width:3px;}

  .result-banner{
    border-radius:var(--radius);padding:30px 26px;text-align:center;margin-bottom:20px;
  }
  .result-banner.qualify{background:var(--success-bg);border:1px solid #b7d2ad;}
  .result-banner.disqualify{background:var(--danger-bg);border:1px solid #ddb3ac;}
  .result-banner .verdict{font-size:26px;font-weight:700;margin:6px 0;}
  .result-banner.qualify .verdict{color:var(--success);}
  .result-banner.disqualify .verdict{color:var(--danger);}
  .result-banner .score-big{font-size:42px;font-weight:700;margin:4px 0;}

  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}

  /* Owner dashboard */
  .pin-box{max-width:340px;margin:60px auto;}
  .cand-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);
    border-radius:8px;background:var(--paper-raised);margin-bottom:10px;cursor:pointer;
  }
  .cand-row:hover{border-color:var(--rust);}
  .cand-row img.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);flex-shrink:0;}
  .cand-row .avatar-fallback{
    width:44px;height:44px;border-radius:50%;background:var(--olive);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;
  }
  .cand-row .meta{flex:1;min-width:0;}
  .cand-row .meta .name{font-weight:600;font-size:15px;}
  .cand-row .meta .sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .pill{font-size:11px;font-weight:700;letter-spacing:0.03em;padding:4px 10px;border-radius:20px;text-transform:uppercase;flex-shrink:0;}
  .pill.qualify{background:var(--success-bg);color:var(--success);}
  .pill.disqualify{background:var(--danger-bg);color:var(--danger);}
  .pill.pending{background:#eee9da;color:var(--ink-soft);}

  .topbar-owner{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .qa-block{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;background:var(--paper-raised);}
  .qa-block .q{font-weight:600;font-size:14.5px;margin:0 0 8px;}
  .qa-block .a{font-size:14px;color:var(--ink-soft);margin:0 0 10px;white-space:pre-wrap;}
  .qa-block .grade-row{display:flex;align-items:center;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:10px;}
  .qa-block .grade-score{font-weight:700;}
  .grade-good{color:var(--success);}
  .grade-mid{color:var(--mustard);}
  .grade-low{color:var(--danger);}

  .cat-bars{display:grid;gap:10px;margin:18px 0;}
  .cat-bar-row{display:grid;grid-template-columns:140px 1fr 40px;align-items:center;gap:10px;font-size:13px;}
  .cat-bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:4px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .err-box{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:12px 14px;font-size:13.5px;margin:14px 0;}

  a.linklike{color:var(--rust);text-decoration:none;cursor:pointer;font-weight:600;font-size:13px;}
  a.linklike:hover{text-decoration:underline;}
  .cand-row{flex-wrap:wrap;}
  .qa-meta{font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:6px;padding:6px 9px;margin:0 0 10px;}
  .qa-meta.warn{background:#f5e9d8;color:#8a5a14;}
  .qa-meta.bad{background:var(--danger-bg);color:var(--danger);}
  .qa-ideal{font-size:12.5px;color:var(--olive-deep);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;}
  .integrity-box{border-radius:8px;padding:14px 16px;margin:0 0 16px;font-size:13.5px;}
  .integrity-box h4{margin:0 0 6px;font-size:15px;}
  .integrity-box ul{margin:6px 0 8px 18px;padding:0;}
  .integrity-box .note{font-size:12px;opacity:.85;margin:6px 0 0;}
  @media print{
    body{background:#fff;}
    .no-print,.owner-link{display:none !important;}
    .card{box-shadow:none;border:1px solid #999;}
    .qa-block,.result-banner,.integrity-box{break-inside:avoid;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .wrap{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   ATUL 3-WHEELER SALES — ADAPTIVE INTERVIEW APP
   Single-file SPA. Owner-gated results. Excel export.
========================================================= */

const OWNER_PIN = "73194"; // change this PIN as needed, share only with owner/MD
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyySpHOvepagxDaSRN5GKIQODzPLoanS94G8VhSYNNFt0gKmiBOtlJZh2iWfFLqYKT2/exec";

async function saveCandidateToSheet(candidateRecord) {
  // Apps Script web apps don't return readable CORS responses to fetch(),
  // so we send with no-cors (fire-and-forget) and verify separately by re-reading the sheet.
  await fetch(SHEETS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      submittedAt: candidateRecord.submittedAt,
      name: candidateRecord.name,
      phone: candidateRecord.phone,
      role: candidateRecord.role,
      overallScore: candidateRecord.finalResult ? candidateRecord.finalResult.overallScore : "",
      verdict: candidateRecord.finalResult ? candidateRecord.finalResult.verdict : "",
      categoryScores: candidateRecord.finalResult ? candidateRecord.finalResult.categoryScores : {},
      summary: candidateRecord.finalResult ? candidateRecord.finalResult.summary : "",
      qaLog: candidateRecord.qaLog,
      id: candidateRecord.id,
      aiFailureCount: candidateRecord.aiFailureCount,
      photo: candidateRecord.photo || "",
      copyFlag: candidateRecord.copyFlag || "",
      styleFlag: candidateRecord.styleFlag || "",
      location: candidateRecord.location || ""
    })
  });
  // Verify the row landed (retry a few times; Apps Script can be slow).
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    await new Promise(r => setTimeout(r, 1500 * attempt));
    try {
      const res = await fetch(SHEETS_URL + "?_=" + Date.now());
      if (!res.ok) throw new Error("షీట్ స్పందన లోపం (HTTP " + res.status + ")");
      const rows = await res.json();
      const found = rows.some(r => String(r["Name"]) === candidateRecord.name && String(r["Phone"]) === String(candidateRecord.phone));
      if (found) return true;
      lastErr = new Error("షీట్‌లో సేవ్ నిర్ధారించబడలేదు.");
    } catch (e) {
      lastErr = (e instanceof TypeError)
        ? new Error("షీట్‌ను చేరుకోలేకపోయాం — ఇంటర్నెట్ లేదా షీట్ లింక్ (Apps Script) అనుమతి సమస్య")
        : e;
    }
  }
  throw lastErr || new Error("సేవ్ నిర్ధారించలేకపోయాం.");
}

function parseQaLog(raw) {
  if (!raw) return [];
  try { return JSON.parse(raw); } catch (e) { return []; }
}

const CATEGORY_META = {
  logic: { label: "తార్కిక ఆలోచన", color: "#4d3c8a" },
  product: { label: "ఉత్పత్తి పరిజ్ఞానం", color: "#102a57" },
  sales: { label: "సేల్స్ నైపుణ్యం", color: "#8a3416" },
  situational: { label: "పరిస్థితుల అంచనా", color: "#8a5a14" },
  communication: { label: "కమ్యూనికేషన్", color: "#2c5a6b" }
};

const TOTAL_QUESTIONS = 9;
const QUALIFY_THRESHOLD = 65; // percent

let state = {
  screen: "intake", // intake | interview | submitting | done | owner-pin | owner-dashboard | owner-detail
  candidate: { name: "", phone: "", role: "", photo: "" },
  qaLog: [], // {question, category, answer, score, feedback}
  currentQuestion: null,
  loadingNext: false,
  finalResult: null,
  ownerPinInput: "",
  ownerError: "",
  allCandidates: [],
  selectedCandidateId: null,
  submitError: "",
  aiFailureCount: 0 // tracks how many times AI calls failed during this candidate's interview
};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = "";
  app.appendChild(Brandbar());
  if (state.screen === "intake") app.appendChild(IntakeScreen());
  else if (state.screen === "interview") app.appendChild(InterviewScreen());
  else if (state.screen === "submitting") app.appendChild(SubmittingScreen());
  else if (state.screen === "done") app.appendChild(DoneScreen());
  else if (state.screen === "owner-pin") app.appendChild(OwnerPinScreen());
  else if (state.screen === "owner-dashboard") app.appendChild(OwnerDashboard());
  else if (state.screen === "owner-detail") app.appendChild(OwnerDetail());
}

/* ---------------- INTAKE ---------------- */
function IntakeScreen(){
  const wrap = document.createElement('div');
  const card = document.createElement('div');
  card.className = "card";
  card.innerHTML = `
    <p class="eyebrow">దరఖాస్తు</p>
    <h2>సేల్స్ టీమ్ ఇంటర్వ్యూ</h2>

    <label>పూర్తి పేరు</label>

    <label>ఫోన్ నంబర్</label>
    <input type="tel" id="f_phone" placeholder="10-అంకెల మొబైల్ నంబర్" value="${escapeHtml(state.candidate.phone)}">

    <label>దరఖాస్తు చేస్తున్న పోస్ట్</label>
    <select id="f_role">
      <option value="">ఒకటి ఎంచుకోండి</option>
      <option value="Fresher" ${state.candidate.role==="Fresher"?"selected":""}>ఫ్రెషర్ — ఐచర్ ప్రో X సేల్స్</option>
      <option value="Experienced" ${state.candidate.role==="Experienced"?"selected":""}>అనుభవం ఉన్నవారు — ఐచర్ ప్రో X సేల్స్</option>

    <label>ఫోటో <span style="color:var(--rust);">*తప్పనిసరి</span></label>
    <div class="photo-zone" id="photoZone">
      ${state.candidate.photo ? `<img src="${state.candidate.photo}">` : `<div class="hint">ఫోటో తీయడానికి లేదా అప్‌లోడ్ చేయడానికి నొక్కండి</div>`}
      <input type="file" id="f_photo" accept="image/*" capture="environment" style="display:none;">
    </div>

    <div id="intakeErr"></div>
    <button class="btn btn-primary btn-block" id="startBtn">ఇంటర్వ్యూ ప్రారంభించండి</button>
    <p class="footer-note">మీ సమాధానాలు గోప్యంగా సమీక్షించబడతాయి. ఫలితాలు కేవలం నియామక యజమానికి మాత్రమే కనిపిస్తాయి.<br>గమనిక: ఈ ఇంటర్వ్యూలో ప్రతి ప్రశ్నకు పట్టిన సమయం, పేస్ట్ చేయడం, వేరే ట్యాబ్/యాప్‌కు వెళ్లడం నమోదు చేయబడతాయి. దయచేసి మీ స్వంత జ్ఞానంతోనే సమాధానాలు రాయండి.</p>
  `;
  wrap.appendChild(card);

  card.querySelector('#f_name').oninput = e => state.candidate.name = e.target.value;
  card.querySelector('#f_phone').oninput = e => state.candidate.phone = e.target.value.replace(/[^\d+\s-]/g,'');
  card.querySelector('#f_role').onchange = e => state.candidate.role = e.target.value;

  const zone = card.querySelector('#photoZone');
  const fileInput = card.querySelector('#f_photo');
  zone.onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        // Resize down to a small thumbnail so the base64 stays well under
        // Google Sheets' ~50,000 char per-cell limit.
        const maxDim = 120;
        let { width, height } = img;
        if (width > height) {
          if (width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        } else {
          if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        state.candidate.photo = canvas.toDataURL('image/jpeg', 0.4);
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  card.querySelector('#startBtn').onclick = async () => {
    const errBox = card.querySelector('#intakeErr');
    if (!state.candidate.name.trim() || !state.candidate.phone.trim() || !state.candidate.role) {
      errBox.innerHTML = `<div class="err-box">కొనసాగించడానికి దయచేసి పేరు, ఫోన్ నంబర్ నింపి, పోస్ట్ ఎంచుకోండి.</div>`;
      return;
    }
    if (state.candidate.phone.replace(/\D/g,'').length < 10) {
      errBox.innerHTML = `<div class="err-box">దయచేసి సరైన ఫోన్ నంబర్ నమోదు చేయండి.</div>`;
      return;
    }
    if (!state.candidate.photo) {
      errBox.innerHTML = `<div class="err-box">ప్రారంభించే ముందు దయచేసి ఫోటో తీయండి లేదా అప్‌లోడ్ చేయండి — పైన ఉన్న ఫోటో బాక్స్‌ను నొక్కండి.</div>`;
      zone.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    state.candidate.id = 'cand_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    state.candidate.submittedAt = new Date().toISOString();

    // Capture location in the background (best-effort, never blocks the interview if denied/unavailable)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(5);
          const lng = pos.coords.longitude.toFixed(5);
          state.candidate.location = `https://www.google.com/maps?q=${lat},${lng}`;
        },
        () => { state.candidate.location = "లొకేషన్ షేర్ చేయలేదు"; },
        { timeout: 5000 }
      );
    } else {
      state.candidate.location = "ఈ పరికరంలో లొకేషన్ మద్దతు లేదు";
    }

    state.screen = "interview";
    render();
    await fetchNextQuestion();
  };

  return wrap;
}

/* ---------------- INTERVIEW ---------------- */
function InterviewScreen(){
  const wrap = document.createElement('div');
  const card = document.createElement('div');
  card.className = "card";

  const segHtml = Array.from({length: TOTAL_QUESTIONS}).map((_,i) => {
    let cls = "progress-seg";
    if (i < state.qaLog.length) cls += " done";
    else if (i === state.qaLog.length) cls += " active";
    return `<div class="${cls}"></div>`;
  }).join("");

  if (state.loadingNext || !state.currentQuestion) {
    card.innerHTML = `
      <div class="progress-rail">${segHtml}</div>
      <div class="loading-row"><div class="spinner"></div> మీ తదుపరి ప్రశ్నను సిద్ధం చేస్తున్నాం...</div>
    `;
    wrap.appendChild(card);
    return wrap;
  }

  const q = state.currentQuestion;
  const catMeta = CATEGORY_META[q.category] || {label: q.category};
  card.innerHTML = `
    <div class="progress-rail">${segHtml}</div>
    <span class="qcat ${q.category}">${catMeta.label}</span>
    <p class="qtext">${escapeHtml(q.question)}</p>
    <textarea id="answerBox" placeholder="మీ సమాధానం ఇక్కడ టైప్ చేయండి..."></textarea>
    <div id="interviewErr"></div>
    <button class="btn btn-primary btn-block" id="submitAnswerBtn">సమాధానం సమర్పించండి</button>
  `;
  wrap.appendChild(card);

  const box = card.querySelector('#answerBox');
  setTimeout(() => box.focus(), 50);
  box.addEventListener('paste', (e) => {
    const cd = e.clipboardData || window.clipboardData;
    const txt = cd ? cd.getData('text') : '';
    if (state.currentMeta) { state.currentMeta.pastes++; state.currentMeta.pastedChars += txt.length; }
  });
  box.addEventListener('drop', (e) => {
    const txt = e.dataTransfer ? e.dataTransfer.getData('text') : '';
    if (state.currentMeta) { state.currentMeta.pastes++; state.currentMeta.pastedChars += txt.length; }
  });
  box.addEventListener('keydown', () => { if (state.currentMeta) state.currentMeta.keys++; });

  card.querySelector('#submitAnswerBtn').onclick = async () => {
    const ans = box.value.trim();
    const errBox = card.querySelector('#interviewErr');
    if (!ans) {
      errBox.innerHTML = `<div class="err-box">కొనసాగించే ముందు దయచేసి సమాధానం రాయండి.</div>`;
      return;
    }
    state.loadingNext = true;
    render();
    await gradeAnswerAndAdvance(q, ans);
  };

  return wrap;
}

function DoneScreen(){
  const wrap = document.createElement('div');
  const card = document.createElement('div');

  if (state.saveSucceeded) {
    card.innerHTML = `
      <p class="eyebrow">ఇంటర్వ్యూ పూర్తయింది</p>
      <h2>ధన్యవాదాలు, ${escapeHtml(state.candidate.name.split(' ')[0] || 'అభ్యర్థి')}.</h2>
      <p class="sub">మీ ఇంటర్వ్యూ రికార్డ్ చేయబడి సమీక్ష కోసం సమర్పించబడింది. మీరు తదుపరి రౌండ్‌కు షార్ట్‌లిస్ట్ అయితే మా నియామక బృందం <strong>${escapeHtml(state.candidate.phone)}</strong> నంబర్‌కు సంప్రదిస్తుంది.</p>
      <p class="footer-note">మీరు ఇప్పుడు ఈ పేజీని మూసివేయవచ్చు.</p>
    `;
  } else {
    const backupCode = btoa(unescape(encodeURIComponent(JSON.stringify({
      id: state.candidate.id, name: state.candidate.name, phone: state.candidate.phone,
      role: state.candidate.role, submittedAt: state.candidate.submittedAt,
      qaLog: state.qaLog, finalResult: state.finalResult
    }))));
    card.innerHTML = `
      <p class="eyebrow">ఇంటర్వ్యూ పూర్తయింది — సేవ్ చేయడంలో సమస్య</p>
      <h2>మీ సమాధానాలు ఆటోమేటిక్‌గా సేవ్ కాలేదు</h2>
      <p class="sub">మేము ఇప్పుడు మీ ఫలితాన్ని నియామక బృందం సిస్టమ్‌కు సేవ్ చేయలేకపోయాం (${escapeHtml(state.saveErrorDetail || 'కనెక్షన్ సమస్య')}). దయచేసి ఈ పేజీని మూసివేయవద్దు — బదులుగా, కింద ఉన్న కోడ్ యొక్క స్క్రీన్‌షాట్ తీసి, మీ పేరు మరియు ఫోన్ నంబర్‌తో పాటు ఈ ఇంటర్వ్యూ లింక్ మీకు షేర్ చేసిన వ్యక్తికి పంపండి.</p>
      <textarea readonly style="font-family:monospace; font-size:11px; min-height:90px;">${backupCode}</textarea>
      <button class="btn btn-ghost btn-block" id="retrySaveBtn">మళ్ళీ సేవ్ చేయడానికి ప్రయత్నించండి</button>
    `;
    wrap.appendChild(card);
    setTimeout(() => {
      const btn = document.getElementById('retrySaveBtn');
      if (btn) btn.onclick = async () => {
        state.screen = "submitting";
        render();
        await retrySave();
      };
    }, 0);
    return wrap;
  }

  wrap.appendChild(card);
  return wrap;
}

async function retrySave() {
  const candidateRecord = {
    id: state.candidate.id,
    name: state.candidate.name,
    phone: state.candidate.phone,
    role: state.candidate.role,
    photo: state.candidate.photo,
    submittedAt: state.candidate.submittedAt,
    qaLog: state.qaLog,
    finalResult: state.finalResult,
    aiFailureCount: state.aiFailureCount
  };
  try {
    await saveCandidateToSheet(candidateRecord);
    state.saveSucceeded = true;
    state.saveErrorDetail = "";
  } catch (err) {
    state.saveSucceeded = false;
    state.saveErrorDetail = (err && err.message) ? err.message : "షీట్‌కు సేవ్ చేయడంలో తెలియని లోపం.";
  }
  state.screen = "done";
  render();
}

function OwnerDashboard(){
  const wrap = document.createElement('div');

  if (state.loadError) {
    const errBanner = document.createElement('div');
    errBanner.className = "err-box";
    errBanner.style.marginBottom = "12px";
    errBanner.textContent = "ఫలితాలు లోడ్ చేయలేకపోయాం: " + state.loadError + " — మళ్ళీ ప్రయత్నించడానికి రిఫ్రెష్ నొక్కండి.";
    wrap.appendChild(errBanner);
  }

  const top = document.createElement('div');
  top.className = "topbar-owner";
  top.innerHTML = `
    <h2 style="margin:0;">అభ్యర్థులు (${state.allCandidates.length})</h2>
    <div class="no-print" style="display:flex; gap:8px;">
      <button class="btn btn-ghost" id="printBtn"><span>🖨 ప్రింట్</span></button>
      <button class="btn btn-ghost" id="refreshBtn"><span>రిఫ్రెష్</span></button>
      <button class="btn btn-ghost" id="exportBtn"><span>Excel కు ఎగుమతి చేయండి</span></button>
    </div>
  `;
  wrap.appendChild(top);

  if (state.allCandidates.length === 0) {
    const empty = document.createElement('div');
    empty.className = "card empty-state";
    empty.textContent = "ఇంటర్వ్యూ ఇంకా పూర్తి చేసిన అభ్యర్థులు లేరు.";
    wrap.appendChild(empty);
  } else {
    const sorted = [...state.allCandidates].sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
    sorted.forEach(c => {
      const row = document.createElement('div');
      row.className = "cand-row";

      const verdictClass = c.finalResult ? (c.finalResult.verdict === "Qualify" ? "qualify" : "disqualify") : "pending";
      const verdictText = c.finalResult ? (c.finalResult.verdict === "Qualify" ? "అర్హత" : "అనర్హత") : "పెండింగ్‌లో ఉంది";
      row.innerHTML = `
        ${c.photo ? `<img class="avatar" src="${c.photo}">` : `<div class="avatar-fallback">${initials}</div>`}
        <div class="meta">
          <div class="name">${escapeHtml(c.name)}</div>
          <p class="sub">${escapeHtml(c.role || '')} · ${escapeHtml(c.phone || '')}</p>
        </div>
        <span class="pill ${verdictClass}">${verdictText}</span>
        ${c.copyFlag
          ? `<span class="pill" style="background:#f8d7da;color:#842029;margin-left:6px;">⚠️ కాపీ కావొచ్చు</span>`
          : `<span class="pill" style="background:#d1e7dd;color:#0f5132;margin-left:6px;">✓ నిజమైనది</span>`}
      `;
      row.insertAdjacentHTML('beforeend', integrityPill(c));
      row.onclick = () => { state.selectedCandidateId = c.id; state.screen = "owner-detail"; render(); };
      wrap.appendChild(row);
    });
  }

  const importCard = document.createElement('div');
  importCard.className = "card no-print";
  importCard.style.marginTop = "20px";
  importCard.innerHTML = `
    <p class="eyebrow">తప్పిపోయిన ఫలితాన్ని రికవర్ చేయండి</p>
    <p class="sub" style="margin-bottom:10px;">ఒక అభ్యర్థి తన ఫలితం సేవ్ కాలేదని చెప్పి బ్యాకప్ కోడ్ పంపితే, దానిని ఇక్కడ పేస్ట్ చేయండి.</p>

    <div id="importErr"></div>

  `;
  wrap.appendChild(importCard);

  setTimeout(() => {
    const pb = document.getElementById('printBtn'); if (pb) pb.onclick = () => window.print();
    const btn = document.getElementById('exportBtn');
    if (btn) btn.onclick = exportToExcel;

      const box = document.getElementById('importCodeBox');
      const errBox = document.getElementById('importErr');
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(box.value.trim()))));
        if (!decoded.id || !decoded.name) throw new Error("కోడ్‌లో అవసరమైన వివరాలు లేవు.");

      }
    };
  }, 0);

  return wrap;
}

    </div>
    <div class="cat-bars" id="catBars"></div>
  `;
  wrap.appendChild(headerCard);

  const catBars = headerCard.querySelector('#catBars');
  if (fr.categoryScores) {
    Object.entries(fr.categoryScores).forEach(([cat, score]) => {
      const meta = CATEGORY_META[cat] || {label: cat, color: '#888'};
      const row = document.createElement('div');
      row.className = "cat-bar-row";
      row.innerHTML = `
        <div>${meta.label}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${score}%; background:${meta.color};"></div></div>
        <div style="text-align:right; font-weight:600;">${score}%</div>
      `;
      catBars.appendChild(row);
    });
  }

  const qaTitle = document.createElement('h3');
  qaTitle.textContent = "ప్రశ్న వారీగా సమీక్ష";
  qaTitle.style.margin = "8px 0 12px";
  wrap.appendChild(qaTitle);

  (c.qaLog || []).forEach((qa, idx) => {
    const block = document.createElement('div');
    block.className = "qa-block";
    const meta = CATEGORY_META[qa.category] || {label: qa.category};
    let gradeClass = "grade-mid";
    if (qa.score >= 75) gradeClass = "grade-good";
    else if (qa.score < 50) gradeClass = "grade-low";
    block.innerHTML = `
      <span class="qcat ${qa.category}" style="margin-bottom:8px;">${meta.label}</span>
      <p class="q">${idx+1}. ${escapeHtml(qa.question)}</p>
      <p class="a">${escapeHtml(qa.answer)}</p>
      ${qaMetaHtml(qa)}
      <div class="grade-row">
        <span class="grade-score ${gradeClass}">${qa.score}/100</span>
        <span style="color:var(--ink-soft);">${escapeHtml(qa.feedback || '')}</span>
      </div>
      ${qa.correctAnswer ? `<div class="qa-ideal"><strong>ఆదర్శ సమాధానం:</strong> ${escapeHtml(qa.correctAnswer)}</div>` : ''}
    `;
    wrap.appendChild(block);
  });

  return wrap;
}

    { text: "కమర్షియల్ వాహనం మొదటిసారి కొంటున్న, క్రెడిట్ హిస్టరీ తక్కువ ఉన్న కస్టమర్‌కు మీరు ఏ ఫైనాన్సింగ్ లేదా EMI ఆప్షన్లు అందిస్తారు?", keywords: ["down payment","guarantor","co-applicant","nbfc","finance","emi","cibil","డౌన్ పేమెంట్","గ్యారంటర్"], correctAnswer: "లోన్ రిస్క్ తగ్గించడానికి ఎక్కువ డౌన్ పేమెంట్ సూచించాలి, గ్యారంటర్ లేదా కో-అప్లికెంట్ చేర్చాలి, వాహన ఆదాయ అంచనాను చూపించాలి, కమర్షియల్ వాహన ఫైనాన్స్ అందించే బ్యాంకులు/NBFCలను పరిశీలించాలి." },
    { text: "మొదటిసారి కొనుగోలుదారుకు భరోసా ఇవ్వడానికి మీరు ఏ ఆఫ్టర్-సేల్స్ సర్వీస్ లేదా వారంటీ అంశాలు చెబుతారు?", keywords: ["warranty","service","after-sales","spare parts","maintenance","uptime","వారంటీ","సర్వీస్"], correctAnswer: "చెప్పాల్సినవి: తయారీదారు వారంటీ కాలం, సమీపంలోని అధీకృత సర్వీస్ సెంటర్లు, స్పేర్ పార్ట్స్ లభ్యత, షెడ్యూల్డ్ మెయింటెనెన్స్ మద్దతు, ఐచర్ అప్‌టైమ్ సర్వీసెస్, ఐచర్ జెన్యూన్ పార్ట్స్, My Eicher యాప్ మరియు ఐచర్ ఫైనాన్స్/ఎక్స్ఛేంజ్ వంటి సేవలు." },
    { text: "పోటీదారు కంపెనీ చిన్న కమర్షియల్ వాహనం చౌకగా ఉందని కస్టమర్ చెప్పారు. ఐచర్ ప్రో X విలువను మీరు ఎలా వివరిస్తారు?", keywords: ["total cost","ownership","mileage","maintenance","resale","brand","service","uptime","మొత్తం ఖర్చు","నిర్వహణ"], correctAnswer: "ధర తేడాను అంగీకరించాలి, తర్వాత మొత్తం యాజమాన్య ఖర్చుపై దృష్టి మార్చాలి: ఇంధన పొదుపు, తక్కువ మెయింటెనెన్స్, ఆఫ్టర్-సేల్స్ సేవ, రీసేల్ విలువ మరియు ఐచర్ బ్రాండ్ నమ్మకం." },
    { text: "డెలివరీ వ్యాపారం నడిపే ఫ్లీట్ యజమానికి ఐచర్ ప్రో X ను మీరు ఎలా పిచ్ చేస్తారు?", keywords: ["fleet","uptime","savings","delivery","cost per km","reliability","ఫ్లీట్","పొదుపు","నమ్మకం"], correctAnswer: "వారి రోజువారీ మార్గాలు మరియు ట్రిప్పులను అడిగి అర్థం చేసుకోవాలి; కిలోమీటరుకు ఖర్చు, నమ్మకమైన పనితీరు, తక్కువ డౌన్‌టైమ్, సర్వీస్ నెట్‌వర్క్ మరియు ఫ్లీట్ పరిమాణం ప్రకారం ఆఫర్లను హైలైట్ చేయాలి." },
    { text: "కొత్త కమర్షియల్ వాహన రిజిస్ట్రేషన్, పర్మిట్ మరియు ప్రభుత్వ ప్రోత్సాహకాల గురించి కస్టమర్ అడిగితే మీరు ఏమి చెబుతారు?", keywords: ["permit","rto","registration","road tax","incentive","subsidy","state","పర్మిట్","రిజిస్ట్రేషన్","సబ్సిడీ"], correctAnswer: "రిజిస్ట్రేషన్/పర్మిట్ నిబంధనలు మరియు ప్రోత్సాహకాలు రాష్ట్రం మరియు ఇంధన రకాన్ని బట్టి మారవచ్చు. తెలిసిన ప్రాథమిక విషయాలు చెప్పి, ఖచ్చితమైన తాజా సమాచారం RTO/కంపెనీ నుండి నిర్ధారించి తెలియజేస్తానని చెప్పాలి; డాక్యుమెంట్లతో సహాయం చేయాలి." }
    ,
    { text: "ఐచర్ ప్రో X డీజిల్‌లో 3T మరియు 3.5T వేరియంట్ల మధ్య తేడా ఏమిటి, మరియు కస్టమర్ అవసరాన్ని బట్టి ఏ బాడీ టైప్ సిఫారసు చేస్తారు?", keywords: ["3t","3.5t","gvw","body","deck","container","reefer","fsd","hsd","బాడీ","లోడ్"], correctAnswer: "ప్రో X డీజిల్ 3T (GVW సుమారు 2995 కిలోలు) మరియు 3.5T (GVW సుమారు 3490 కిలోలు) వేరియంట్లలో వస్తుంది; ఇంజన్ 80 HP. బాడీ టైప్‌లు: ఫిక్స్‌డ్ సైడ్ డెక్ (FSD), హై సైడ్ డెక్ (HSD), HD FSD, MS కంటైనర్, అల్యూమినియం కంటైనర్, రీఫర్ మరియు క్యాబిన్ చాసిస్ (CBC), డెక్ పొడవు 9'8\" లేదా 10'8\". కస్టమర్ లోడ్ రకం, బరువు మరియు ఉపయోగం (ఈ-కామర్స్, FMCG, కోల్డ్ చైన్ మొదలైనవి) బట్టి ఎంచుకోవాలి; ఖచ్చితమైన పేలోడ్ బ్రోచర్‌లో చూసి చెప్పాలి." },
    { text: "ఈ-కామర్స్ పార్సిల్ డెలివరీ, కోల్డ్ చైన్ (పండ్లు, కూరగాయలు) మరియు FMCG రవాణా చేసే కస్టమర్లకు ఐచర్ ప్రో X లో ఏ బాడీ ఎంపికలు సరిపోతాయో వివరించండి.", keywords: ["container","reefer","cold chain","parcel","fmcg","delivery","goods","కంటైనర్","రీఫర్","కోల్డ్ చైన్"], correctAnswer: "పార్సిల్/ఈ-కామర్స్‌కు మూసి ఉన్న కంటైనర్ (MS లేదా అల్యూమినియం), పండ్లు-కూరగాయలు/ఫ్రోజెన్ వస్తువులకు రీఫర్, FMCG కోసం కంటైనర్ లేదా డెక్ బాడీ — వస్తువు రకం, లోడ్ మరియు మార్గాన్ని అడిగి సరైన బాడీ సూచించాలి." }
  ],
  sales: [
    { text: "మొదటిసారి షోరూమ్‌కు వచ్చిన కస్టమర్‌తో మీరు నమ్మకాన్ని ఎలా పెంచుకుంటారు?", keywords: ["greet","listen","needs","trust","smile","understand","honest","నమ్మకం","వినడం"], correctAnswer: "వెచ్చగా పలకరించాలి, మాట్లాడటం కంటే ఎక్కువ వినాలి, మొదట వారి అవసరాలు అర్థం చేసుకోవాలి, ధర మరియు ఆప్షన్ల గురించి నిజాయితీగా ఉండాలి, బలవంతం చేయకూడదు — వారికి సౌకర్యంగా, గౌరవంగా అనిపించేలా చేయాలి." },
    { text: "పోటీదారు ఐచర్ ప్రో X వాహనం చౌకగా ఉందని ఒక కస్టమర్ చెప్పారు. కేవలం ధరను సరిపోల్చకుండా మీరు ఎలా స్పందిస్తారు?", keywords: ["value","total cost","ownership","mileage","maintenance","resale","quality","service","విలువ","మొత్తం ఖర్చు"], correctAnswer: "ధర తేడాను అంగీకరించాలి, తర్వాత మొత్తం యాజమాన్య ఖర్చుపై దృష్టి మార్చాలి: మంచి మైలేజీ, తక్కువ మెయింటెనెన్స్, మెరుగైన ఆఫ్టర్-సేల్స్ సర్వీస్, రీసేల్ విలువ మరియు బ్రాండ్ నమ్మకం." },
    { text: "మొదట్లో ఖచ్చితంగా తెలియని విషయంపై ఎవరినైనా ఒప్పించాల్సిన సందర్భం గురించి చెప్పండి. మీరు ఏ విధానం అనుసరించారు?", keywords: ["listen","understand","explain","patience","trust","example","వినడం","ఓపిక"], correctAnswer: "ఆదర్శ సమాధానం: ఓపికగా విన్నాను, వారి ఆందోళనను అర్థం చేసుకున్నాను, స్పష్టమైన ఉదాహరణ లేదా ప్రదర్శనతో వివరించాను, ఒత్తిడి లేకుండా క్రమంగా నమ్మకాన్ని పెంచాను, నిర్ణయం తీసుకోవడానికి వారికి సమయం ఇచ్చాను." },
    { text: "ఒక కస్టమర్ మూడు మోడళ్లను పోల్చుతూ గందరగోళంగా ఉన్నారు. వారు నిర్ణయం తీసుకోవడానికి మీరు ఎలా సహాయం చేస్తారు?", keywords: ["needs","compare","budget","use case","simplify","recommend","అవసరాలు","బడ్జెట్"], correctAnswer: "వారి ప్రాథమిక వినియోగం (గూడ్స్ రకం), రోజువారీ మార్గం, బడ్జెట్ మరియు ప్రాధాన్యతల గురించి అడగాలి. 2 ఆప్షన్లకు కుదించి, ప్రధాన తేడాలను సరళంగా వివరించి, ఉత్తమమైనదాన్ని నమ్మకంగా సిఫారసు చేయాలి." },
    { text: "సందర్శించి కానీ వెంటనే బుక్ చేయని కస్టమర్‌ను మీరు ఎలా ఫాలో అప్ చేస్తారు?", keywords: ["follow up","call","remind","relationship","patience","not pushy","ఫాలో అప్","కాల్"], correctAnswer: "24-48 గంటల్లో కాల్ చేయాలి, సందర్శించినందుకు ధన్యవాదాలు చెప్పాలి, ప్రశ్నలు ఉన్నాయా అని అడగాలి, ఏదైనా కొత్త ఆఫర్ లేదా సంబంధిత సమాచారం పంచుకోవాలి, బలవంతం చేయకుండా సహాయకరంగా ఉండాలి." },
    { text: "ఎప్పుడూ లోన్ తీసుకోని కారణంగా సందేహిస్తున్న కస్టమర్‌తో మీరు ఏమి చెబుతారు?", keywords: ["reassure","explain","emi","simple","support","trust","భరోసా","వివరణ"], correctAnswer: "వారికి భరోసా ఇవ్వాలి: EMI ప్రక్రియను సరళమైన భాషలో దశలవారీగా వివరించాలి, ఎంతమంది కస్టమర్లు విజయవంతంగా వాహనాలను ఫైనాన్స్ చేశారో పంచుకోవాలి, పేపర్‌వర్క్‌లో సహాయం అందించాలి." },
    { text: "కస్టమర్ ధర గురించి బేరసారాలు చేస్తున్నప్పుడు మీరు ఎలా బ్యాలెన్స్ చేస్తారు?", keywords: ["value","firm","polite","negotiate","విలువ","దృఢంగా"], correctAnswer: "మర్యాదగా, దృఢంగా ఉండాలి; ధరకు బదులు విలువను హైలైట్ చేయాలి; అవసరమైతే పెద్ద డిస్కౌంట్ కాకుండా చిన్న యాడ్-ఆన్‌లు లేదా సర్వీస్ బెనిఫిట్స్ ఆఫర్ చేయవచ్చు." },
    { text: "నెలవారీ లక్ష్యాన్ని చేరుకోలేకపోతే మీరు మీ వ్యూహాన్ని ఎలా మారుస్తారు?", keywords: ["review","leads","follow up","adjust","సమీక్ష","లీడ్లు"], correctAnswer: "పెండింగ్ లీడ్లను సమీక్షించాలి, ఫాలో-అప్‌లను వేగవంతం చేయాలి, ఏ దశలో కస్టమర్లు వెనక్కి తగ్గుతున్నారో విశ్లేషించాలి, తదనుగుణంగా విధానాన్ని సర్దుబాటు చేయాలి." },
    { text: "మీరు కొత్త కస్టమర్‌లను ఎలా కనుగొంటారు (లీడ్ జనరేషన్)?", keywords: ["referrals","local","marketing","network","రిఫరల్స్","నెట్‌వర్క్"], correctAnswer: "ప్రస్తుత కస్టమర్ల నుండి రిఫరల్స్ అడగాలి, స్థానిక వ్యాపార సంఘాలతో నెట్‌వర్క్ చేయాలి, స్థానిక మార్కెటింగ్ మరియు వాక్-ఇన్ ట్రాఫిక్‌ను సద్వినియోగం చేసుకోవాలి." },
    { text: "కస్టమర్ డీల్ దగ్గరగా వచ్చి క్లోజ్ కాకుండా ఆగిపోతే మీరు ఏమి చేస్తారు?", keywords: ["identify objection","address concern","close","ask","సందేహం","క్లోజింగ్"], correctAnswer: "వారి సందేహాన్ని గుర్తించాలి, నేరుగా ఆందోళనను అడగాలి, దానిని పరిష్కరించాలి, తర్వాత మర్యాదగా క్లోజింగ్ ప్రశ్న అడగాలి." }
  ],
  situational: [
    { text: "ఇప్పటికే బుకింగ్ మొత్తం చెల్లించిన కస్టమర్ కుటుంబ అత్యవసర పరిస్థితి వల్ల రద్దు చేయడానికి కాల్ చేశారు. మీరు ఆ కాల్‌ను ఎలా నిర్వహిస్తారు?", keywords: ["empathy","understand","sorry","refund","policy","support","సానుభూతి","రీఫండ్"], correctAnswer: "మొదట సానుభూతి చూపించాలి, వారి పరిస్థితికి క్షమాపణ చెప్పాలి, రద్దు/రీఫండ్ విధానాన్ని స్పష్టంగా వివరించాలి, వీలైతే బుకింగ్‌ను వాయిదా వేయమని ఆఫర్ చేయాలి, వారి అభ్యర్థనను గౌరవంగా ప్రాసెస్ చేయాలి." },
    { text: "ఒకేసారి ఇద్దరు కస్టమర్లు వచ్చారు, మీరు మాత్రమే అందుబాటులో ఉన్న సేల్స్‌పర్సన్. మీరు ఏమి చేస్తారు?", keywords: ["acknowledge","both","priority","colleague","manage","wait","గుర్తించడం","వేచి ఉండటం"], correctAnswer: "వెంటనే ఇద్దరినీ పలకరించాలి, ఇద్దరినీ గుర్తించాలి, ఒకరిని కొద్దిసేపు వేచి ఉండమని మర్యాదగా అడగాలి, అందుబాటులో ఉంటే సహోద్యోగిని పిలవాలి, ఇద్దరు కస్టమర్లలో ఎవరూ నిర్లక్ష్యం చేయబడ్డారని అనిపించకుండా చూసుకోవాలి." },
    { text: "బాగా అమ్ముడవని మోడల్‌ను ప్రమోట్ చేయమని మీ మేనేజర్ మిమ్మల్ని అడుగుతున్నారు. కస్టమర్లతో మీరు దీనిని నిజాయితీగా ఎలా చేరుకుంటారు?", keywords: ["honest","features","benefits","fit","needs","not mislead","నిజాయితీ","ఫీచర్లు"], correctAnswer: "మోడల్ యొక్క నిజమైన బలాలను మరియు దానికి సరిపోయే కస్టమర్ ప్రొఫైల్‌ను హైలైట్ చేయాలి. ఎప్పుడూ తప్పుదారి పట్టించకూడదు. వారి అవసరానికి నిజంగా సరిపోయే కస్టమర్లకు నిజాయితీగా ప్రజెంట్ చేయాలి — నిజాయితీ దీర్ఘకాలిక నమ్మకాన్ని నిర్మిస్తుంది." },
    { text: "డెలివరీ ఆలస్యంపై కస్టమర్ కోపంగా ఉన్నారు. మీరు ఈ పరిస్థితిని ఎలా నిర్వహిస్తారు?", keywords: ["calm","apologize","explain","update","resolve","listen","ప్రశాంతంగా","క్షమాపణ"], correctAnswer: "ప్రశాంతంగా ఉండాలి, వారి అసంతృప్తిని వ్యక్తపరచనివ్వాలి, హృదయపూర్వకంగా క్షమాపణ చెప్పాలి, ఆలస్యానికి కారణాన్ని నిజాయితీగా వివరించాలి, మార్చిన టైమ్‌లైన్ ఇవ్వాలి, పరిష్కారం అయ్యేవరకు ముందుగానే ఫాలో అప్ చేయాలి." },
    { text: "ఒక కస్టమర్ టెస్ట్ డ్రైవ్ కావాలనుకుంటున్నారు కానీ లైసెన్స్ లేదు. మీరు ఏమి చేస్తారు?", keywords: ["policy","rules","license","alternative","explain","విధానం","లైసెన్స్"], correctAnswer: "కంపెనీ విధానం ప్రకారం టెస్ట్ డ్రైవ్‌కు చెల్లుబాటు అయ్యే లైసెన్స్ అవసరమని మర్యాదగా వివరించాలి. ప్రత్యామ్నాయం ఆఫర్ చేయాలి: లైసెన్స్ ఉన్న సహోద్యోగితో డెమో డ్రైవ్ ఏర్పాటు చేయాలి లేదా వారికి లైసెన్స్ వచ్చాక షెడ్యూల్ చేయాలి." },
    { text: "మీ సహోద్యోగి ఫైనాన్సింగ్ గురించి కస్టమర్‌కు తప్పుడు సమాచారం ఇస్తున్నట్లు మీరు గమనించారు. మీరు ఏమి చేస్తారు?", keywords: ["correct","colleague","customer","tactful","accurate","సరిదిద్దడం","సహోద్యోగి"], correctAnswer: "వ్యూహాత్మకంగా జోక్యం చేసుకోవాలి — మర్యాదగా అడుగుపెట్టి కస్టమర్‌కు సరైన సమాచారం ఇవ్వాలి. తర్వాత సహోద్యోగితో ఒంటరిగా మాట్లాడాలి, ఇబ్బంది కలగకుండా మరియు భవిష్యత్తులో ఖచ్చితత్వం ఉండేలా చూసుకోవాలి." },
    { text: "ఒక కస్టమర్ సోషల్ మీడియాలో ప్రతికూల రివ్యూ రాశారు. మీరు ఎలా స్పందిస్తారు?", keywords: ["professional","apologize","offline","resolve","ప్రొఫెషనల్","క్షమాపణ"], correctAnswer: "ప్రొఫెషనల్‌గా, మర్యాదగా బహిరంగంగా స్పందించాలి, అసౌకర్యానికి క్షమాపణ చెప్పాలి, సమస్యను ఆఫ్‌లైన్‌లో పరిష్కరించడానికి సంప్రదించాలి." },
    { text: "వర్షాకాలంలో టెస్ట్ డ్రైవ్‌కు కస్టమర్ వచ్చారు కానీ రోడ్లు సరిగా లేవు. మీరు ఏమి చేస్తారు?", keywords: ["safety","alternative","reschedule","explain","భద్రత","షెడ్యూల్"], correctAnswer: "భద్రతకు ప్రాధాన్యత ఇవ్వాలి, పరిస్థితిని వివరించాలి, సురక్షితమైన మార్గం లేదా వేరే సమయానికి టెస్ట్ డ్రైవ్ షెడ్యూల్ చేయాలి." },
    { text: "ఇద్దరు సేల్స్‌పర్సన్‌లు ఒకే కమిషన్ కోసం పోటీ పడుతున్నారు (ఎవరు మొదట కస్టమర్‌ను కలిశారు అనే విషయంపై వివాదం). మీరు దీన్ని ఎలా నిర్వహిస్తారు?", keywords: ["fair","manager","policy","resolve","న్యాయం","మేనేజర్"], correctAnswer: "ప్రశాంతంగా చర్చించాలి, కంపెనీ విధానాన్ని అనుసరించాలి, అవసరమైతే మేనేజర్‌ను జోక్యం చేసుకోమని అడగాలి, న్యాయంగా పరిష్కరించాలి." },
    { text: "ఒక వాహనంలో డెలివరీకి ముందు చిన్న డ్యామేజ్ కనిపించింది. మీరు కస్టమర్‌కు ఎలా చెబుతారు?", keywords: ["honest","inform","fix","delay","నిజాయితీ","సమాచారం"], correctAnswer: "వెంటనే, నిజాయితీగా కస్టమర్‌కు తెలియజేయాలి, సమస్యను పరిష్కరించే వరకు డెలివరీ ఆలస్యం చేయాలి, పరిస్థితిపై పారదర్శకంగా ఉండాలి." }
  ],
  communication: [

function scoreAnswerLocally(question, answerText) {
  const text = (answerText || "").trim();
  const words = text.split(/\s+/).filter(Boolean);

  if (words.length === 0) {
    return { score: 0, feedback: "సమాధానం ఇవ్వలేదు." };
  }

  const lower = text.toLowerCase();

  // Check correctness FIRST — a short but exactly-correct answer (e.g. "256000")
  // should never be penalized just for being short.
  if (question.answerCheck) {
    const correct = question.answerCheck(text);
    if (correct) {
      return { score: 90, feedback: "సరైన తార్కికం/సమాధానం." };
    }
    // Fall through to keyword check for partial credit even if exact check fails
  }

  if (words.length < 4) {
    // Still give partial credit if the short answer is clearly relevant
    // (e.g. mentions the right concept tersely), instead of an automatic floor score.
    const keywords = question.keywords || [];
    const hasRelevantTerm = keywords.some(k => lower.includes(k.toLowerCase().split(' ')[0].slice(0,4)));
    return hasRelevantTerm
      ? { score: 35, feedback: "సమాధానం అంశానికి సంబంధించినదే కానీ పూర్తిగా అంచనా వేయడానికి చాలా క్లుప్తంగా ఉంది." }
      : { score: 15, feedback: "సరిగ్గా అంచనా వేయడానికి సమాధానం చాలా చిన్నది." };
  }

  const keywords = question.keywords || [];
  let matched = 0;
  keywords.forEach(k => {
    const kw = k.toLowerCase();
    if (kw.includes(' ')) {
      // multi-word phrase: count it as matched if most of its words appear anywhere (typo-tolerant via stem)
      const parts = kw.split(' ').filter(p => p.length > 2);
      const hits = parts.filter(p => lower.includes(p.slice(0, Math.max(4, p.length - 2)))).length;
      if (parts.length === 0 || hits / parts.length >= 0.5) matched++;
    } else {
      // single word: match by stem (first 4-5 chars) so typos/variants still count
      const stem = kw.slice(0, Math.min(kw.length, Math.max(4, kw.length - 2)));
      if (lower.includes(stem)) matched++;
    }
  });
  const coverage = keywords.length > 0 ? matched / keywords.length : 0.5;

  // Base score from keyword coverage, scaled into a realistic 30-95 band
  let score = Math.round(30 + coverage * 65);

  // Small bonus for a reasonably developed answer (shows effort/depth)
  if (words.length >= 25) score = Math.min(95, score + 5);

  // Logic question that had a checkable answer but failed it — cap lower
  if (question.answerCheck && !question.answerCheck(text)) {
    score = Math.min(score, 55);
  }

  score = Math.max(10, Math.min(95, score));

  let feedback;
  if (score >= 75) feedback = "ముఖ్యాంశాలను కవర్ చేసే బలమైన, సంబంధిత సమాధానం.";
  else if (score >= 55) feedback = "సహేతుకమైన సమాధానం; మరింత నిర్దిష్ట వివరాలు చేర్చవచ్చు.";
  else feedback = "సమాధానం అంశానికి సంబంధించినదే కానీ ఇక్కడ ఆశించిన అనేక ముఖ్యాంశాలను కోల్పోయింది.";

  return { score, feedback };
}

function pickNextQuestion() {
  const usedTexts = state.qaLog.map(qa => qa.question);
  const usedCategories = state.qaLog.map(qa => qa.category);
  const categories = Object.keys(QUESTION_BANK);

  // Spread categories evenly: prefer the category used fewest times so far
  const counts = categories.map(cat => usedCategories.filter(c => c === cat).length);
  const minCount = Math.min(...counts);
  const eligibleCats = categories.filter((cat, i) => counts[i] === minCount);
  const category = eligibleCats[Math.floor(Math.random() * eligibleCats.length)];

  const pool = QUESTION_BANK[category].filter(q => !usedTexts.includes(q.text));
  const chosenPool = pool.length > 0 ? pool : QUESTION_BANK[category];

  // Adaptive difficulty isn't a separate field here, but we vary which question
  // within the category based on running average — pick from the back half of the
  // pool (treated as slightly tougher) if they're doing well, front half if struggling.
  const avgSoFar = state.qaLog.length > 0
    ? state.qaLog.reduce((s,qa)=>s+qa.score,0) / state.qaLog.length
    : 50;
  const sorted = chosenPool;
  const half = Math.ceil(sorted.length / 2);
  const slice = avgSoFar >= 60 ? sorted.slice(half === sorted.length ? 0 : sorted.length - half) : sorted.slice(0, half);
  const finalChoices = slice.length > 0 ? slice : sorted;
  const q = finalChoices[Math.floor(Math.random() * finalChoices.length)];

  return { question: q.text, category, _bankRef: q };
}

async function fetchNextQuestion() {
  state.loadingNext = true;
  render();
  // tiny delay so the UI transition doesn't feel instantaneous/jarring
  await new Promise(r => setTimeout(r, 250));
  state.currentQuestion = pickNextQuestion();
  state.currentMeta = { start: Date.now(), pastes: 0, pastedChars: 0, blurs: 0, hiddenMs: 0, hiddenAt: null, keys: 0 };
  state.loadingNext = false;
  render();
}

async function gradeAnswerAndAdvance(question, answerText) {
  const bankQ = question._bankRef || (QUESTION_BANK[question.category] || []).find(q => q.text === question.question);
  const { score, feedback } = scoreAnswerLocally(bankQ || { keywords: [] }, answerText);
  const mm = state.currentMeta || {};
  if (mm.hiddenAt) { mm.hiddenMs = (mm.hiddenMs || 0) + (Date.now() - mm.hiddenAt); mm.hiddenAt = null; }
  state.qaLog.push({
    question: question.question,
    category: question.category,
    answer: answerText,
    secs: mm.start ? Math.round((Date.now() - mm.start) / 1000) : null,
    pastes: mm.pastes || 0,
    pastedChars: mm.pastedChars || 0,
    blurs: mm.blurs || 0,
    hiddenSecs: Math.round((mm.hiddenMs || 0) / 1000),
    keys: mm.keys || 0,
    chars: answerText.length,
    score,
    feedback,
    correctAnswer: (bankQ && bankQ.correctAnswer) ? bankQ.correctAnswer : ""
  });

  if (state.qaLog.length >= TOTAL_QUESTIONS) {
    await finalizeInterview();
  } else {
    state.currentQuestion = null;
    await fetchNextQuestion();
  }
}

function buildLocalSummary(overallScore, categoryScores, verdict) {
  const sorted = Object.entries(categoryScores).sort((a,b)=>b[1]-a[1]);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length-1];
  const strongLabel = strongest ? (CATEGORY_META[strongest[0]]||{}).label || strongest[0] : "";
  const weakLabel = weakest ? (CATEGORY_META[weakest[0]]||{}).label || weakest[0] : "";
  if (verdict === "Qualify") {
    return `మొత్తం స్కోర్ ${overallScore}/100 — అర్హత ప్రమాణాన్ని చేరుకుంది. ${strongLabel} (${strongest[1]}%)లో బలంగా ఉన్నారు, ${weakLabel} (${weakest[1]}%)లో కొంచెం బలహీనంగా ఉన్నారు. తదుపరి రౌండ్‌కు కొనసాగించమని సిఫారసు, ${weakLabel}పై దృష్టి పెట్టాలి.`;
  }
  return `మొత్తం స్కోర్ ${overallScore}/100 — ${QUALIFY_THRESHOLD}% అర్హత ప్రమాణం కంటే తక్కువ. బలహీనమైన అంశం ${weakLabel} (${weakest[1]}%); ఉత్తమ అంశం ${strongLabel} (${strongest[1]}%). తుది నిర్ణయానికి ముందు మాన్యువల్ సమీక్ష సిఫారసు చేయబడింది.`;
}

function normalizeForCompare(text) {
  return (text || "").toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/).filter(w => w.length > 2);
}

function similarity(a, b) {
  const wa = new Set(normalizeForCompare(a));
  const wb = new Set(normalizeForCompare(b));
  if (wa.size === 0 || wb.size === 0) return 0;
  let overlap = 0;
  wa.forEach(w => { if (wb.has(w)) overlap++; });
  return overlap / Math.max(wa.size, wb.size);
}

async function detectCopying(qaLog, ownName) {
  try {
    const res = await fetch(SHEETS_URL + "?_=" + Date.now());
    if (!res.ok) return "";
    const rows = await res.json();
    const matches = [];
    qaLog.forEach(qa => {
      rows.forEach(r => {
        if (String(r["Name"]) === ownName) return; // don't compare against self
        const otherQa = parseQaLog(r["Full Q&A (JSON)"]);
        otherQa.forEach(oq => {
          if (oq.question !== qa.question) return;
          const sim = similarity(qa.answer, oq.answer);
          if (sim >= 0.75 && qa.answer.trim().length > 15) {
            matches.push(`"${qa.question.slice(0,40)}..." matches ${r["Name"]} (${Math.round(sim*100)}% similar)`);
          }
        });
      });
    });
    return matches.length > 0 ? matches.join(" | ") : "";
  } catch (e) {
    console.error("Copy detection check failed", e);
    return "";
  }
}

function detectStyleAnomalies(qaLog) {
  const flags = [];
  const wordCounts = qaLog.map(qa => (qa.answer || "").trim().split(/\s+/).filter(Boolean).length);
  const avgWords = wordCounts.reduce((a,b)=>a+b,0) / (wordCounts.length || 1);

  qaLog.forEach((qa, i) => {
    const text = qa.answer || "";
    const lower = text.toLowerCase();
    const wc = wordCounts[i];
    const reasons = [];

    // Textbook/generic phrasing unlikely in spoken, off-the-cuff sales answers
    const foundPhrase = TEXTBOOK_PHRASES.find(p => lower.includes(p));
    if (foundPhrase) reasons.push(`generic textbook phrasing ("${foundPhrase}")`);

    // Punctuation typically left behind by copy-pasting (smart quotes, em-dashes)
    // when the rest of the candidate's answers don't use this style.
    const hasSmartPunct = /[“”‘’—]/.test(text);
    const otherAnswersUseSmartPunct = qaLog.some((other,j) => j !== i && /[“”‘’—]/.test(other.answer || ""));
    if (hasSmartPunct && !otherAnswersUseSmartPunct) reasons.push("unusual punctuation style vs. their other answers");

    // Answer dramatically longer/more polished than their typical answer length
    if (avgWords > 0 && wc > avgWords * 2.2 && wc > 30) reasons.push("unusually long/polished compared to their other answers");

    if (reasons.length > 0) {
      flags.push(`"${qa.question.slice(0,40)}..." — ${reasons.join(", ")}`);
    }
  });

  return flags.length > 0 ? flags.join(" | ") : "";
}

async function finalizeInterview() {
  state.screen = "submitting";
  render();

  // Compute category scores
  const categoryScores = {};
  const categoryCounts = {};
  state.qaLog.forEach(qa => {
    categoryScores[qa.category] = (categoryScores[qa.category] || 0) + qa.score;
    categoryCounts[qa.category] = (categoryCounts[qa.category] || 0) + 1;
  });
  Object.keys(categoryScores).forEach(cat => {
    categoryScores[cat] = Math.round(categoryScores[cat] / categoryCounts[cat]);
  });

  const overallScore = Math.round(
    state.qaLog.reduce((sum, qa) => sum + qa.score, 0) / state.qaLog.length
  );
  const verdict = overallScore >= QUALIFY_THRESHOLD ? "Qualify" : "Disqualify";
  const summary = buildLocalSummary(overallScore, categoryScores, verdict);

  state.finalResult = { overallScore, categoryScores, verdict, summary };

  const copyFlag = await detectCopying(state.qaLog, state.candidate.name);
  const styleFlag = detectStyleAnomalies(state.qaLog);

  const candidateRecord = {
    id: state.candidate.id,
    name: state.candidate.name,
    phone: state.candidate.phone,
    role: state.candidate.role,
    photo: state.candidate.photo,
    location: state.candidate.location || "",
    submittedAt: state.candidate.submittedAt,
    qaLog: state.qaLog,
    finalResult: state.finalResult,
    aiFailureCount: state.aiFailureCount,
    copyFlag,
    styleFlag
  };

  let saveSucceeded = false;
  let saveErrorDetail = "";

  try {
    await saveCandidateToSheet(candidateRecord);
    saveSucceeded = true;
  } catch (err) {
    console.error("Sheet save failed", err);
    saveErrorDetail = (err && err.message) ? err.message : "షీట్‌కు సేవ్ చేయడంలో తెలియని లోపం.";
  }

  state.saveSucceeded = saveSucceeded;
  state.saveErrorDetail = saveErrorDetail;

  state.screen = "done";
  render();
}

/* ---------------- INTEGRITY (AI / Google / copy) SIGNALS ---------------- */
function setupIntegrityTracking() {
  const cur = () => (state.screen === "interview" && state.currentQuestion && state.currentMeta) ? state.currentMeta : null;
  const hide = () => { const m = cur(); if (m && !m.hiddenAt) { m.hiddenAt = Date.now(); m.blurs++; } };
  const show = () => { const m = cur(); if (m && m.hiddenAt) { m.hiddenMs += Date.now() - m.hiddenAt; m.hiddenAt = null; } };
  document.addEventListener('visibilitychange', () => { document.hidden ? hide() : show(); });
  window.addEventListener('blur', hide);
  window.addEventListener('focus', show);
}

function analyzeIntegrity(qaLog, copyFlag) {
  const log = qaLog || [];
  if (!log.some(q => q.secs != null)) return { level: "unknown", reasons: [], pastes: 0, leaves: 0, totalSecs: 0 };
  let strong = 0, left = 0, fast = 0, pastes = 0, leaves = 0, totalSecs = 0;
  const reasons = [];
  log.forEach((q, i) => {
    const n = i + 1;
    const chars = q.chars || (q.answer || "").length;
    totalSecs += q.secs || 0; pastes += q.pastes || 0; leaves += q.blurs || 0;
    if ((q.pastedChars || 0) >= 20) { strong++; reasons.push("ప్రశ్న " + n + ": బయటి నుండి కాపీ చేసిన టెక్స్ట్ పేస్ట్ చేశారు (" + q.pastedChars + " అక్షరాలు)"); }
    else if ((q.pastes || 0) > 0) { reasons.push("ప్రశ్న " + n + ": పేస్ట్ చేశారు (చిన్న టెక్స్ట్)"); }
    if ((q.blurs || 0) >= 1 && (q.hiddenSecs || 0) >= 3) { left++; reasons.push("ప్రశ్న " + n + ": సమాధానం రాస్తూ వేరే ట్యాబ్/యాప్‌కు వెళ్లారు (" + q.blurs + " సార్లు, మొత్తం " + q.hiddenSecs + " సెకన్లు)"); }
    if (chars > 40 && q.secs > 0 && chars / q.secs > 12) { fast++; reasons.push("ప్రశ్న " + n + ": " + chars + " అక్షరాలు కేవలం " + q.secs + " సెకన్లలో — టైప్ చేయడానికి అసాధారణ వేగం"); }
  });
  if (copyFlag) reasons.push("ఇతర అభ్యర్థి సమాధానాలతో దాదాపు సమానంగా ఉన్నాయి");
  let level = "low";
  if (strong >= 1 || left >= 1 || fast >= 2) level = "medium";
  if (strong >= 2 || (strong >= 1 && left >= 1) || left >= 3 || copyFlag) level = "high";
  return { level, reasons, pastes, leaves, totalSecs };
}

const INTEGRITY_UI = {
  high:    { label: "🔴 అధిక అనుమానం — AI / Google / కాపీ వాడి ఉండే అవకాశం ఎక్కువ", short: "🔴 అనుమానం ఎక్కువ", bg: "#f6e8e4", fg: "#a3342b" },
  medium:  { label: "🟠 కొంత అనుమానం — మాన్యువల్‌గా సమీక్షించండి", short: "🟠 కొంత అనుమానం", bg: "#f5e9d8", fg: "#8a5a14" },
  low:     { label: "🟢 అనుమానాస్పద సంకేతాలు కనిపించలేదు", short: "🟢 స్వంతంగా రాశారు", bg: "#e9f0e4", fg: "#3c6b3f" },
  unknown: { label: "⚪ ట్రాకింగ్ డేటా లేదు (పాత ఇంటర్వ్యూ)", short: "⚪ డేటా లేదు", bg: "#eee9da", fg: "#5b5849" }
};

function integrityPill(c) {
  const r = analyzeIntegrity(c.qaLog, c.copyFlag);
  const u = INTEGRITY_UI[r.level];
  return '<span class="pill" style="background:' + u.bg + ';color:' + u.fg + ';margin-left:6px;">' + u.short + '</span>';
}

function integrityHtml(c) {
  const r = analyzeIntegrity(c.qaLog, c.copyFlag);
  const u = INTEGRITY_UI[r.level];
  const list = r.reasons.length ? '<ul>' + r.reasons.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>' : '';
  const stats = r.level === "unknown" ? '' : '<div>మొత్తం సమయం: ' + Math.round(r.totalSecs / 60 * 10) / 10 + ' నిమిషాలు · పేస్ట్ చేసిన సార్లు: ' + r.pastes + ' · పేజీ వదిలి వెళ్లిన సార్లు: ' + r.leaves + '</div>';
  return '<div class="integrity-box" style="background:' + u.bg + ';color:' + u.fg + ';"><h4>' + u.label + '</h4>' + stats + list +
    '<p class="note">గమనిక: ఇది రుజువు కాదు, కేవలం సూచన. అభ్యర్థి తన రెండో ఫోన్‌లో Google/AI చూసి చేతితో టైప్ చేస్తే ఈ యాప్ కనిపెట్టలేదు. అందుకే తుది నిర్ణయానికి ముందు ఫోన్/నేరుగా కలిసి 2-3 ప్రశ్నలు మళ్ళీ అడగండి.</p></div>';
}

function qaMetaHtml(qa) {
  if (qa.secs == null) return '';
  let cls = 'qa-meta';
  if ((qa.pastedChars || 0) >= 20) cls += ' bad';
  else if ((qa.pastes || 0) > 0 || ((qa.blurs || 0) >= 1 && (qa.hiddenSecs || 0) >= 3)) cls += ' warn';
  return '<div class="' + cls + '">⏱ ' + qa.secs + ' సె · ✍️ ' + (qa.chars || 0) + ' అక్షరాలు · 📋 పేస్ట్: ' + (qa.pastes || 0) + ((qa.pastedChars || 0) ? ' (' + qa.pastedChars + ' అక్షరాలు)' : '') + ' · 🔀 పేజీ వదిలారు: ' + (qa.blurs || 0) + ' సార్లు (' + (qa.hiddenSecs || 0) + ' సె)</div>';
}

/* ---------------- OWNER DATA LOADING ---------------- */
async function loadAllCandidates() {
  try {
    const res = await fetch(SHEETS_URL + "?_=" + Date.now());
    if (!res.ok) throw new Error("షీట్ చేరుకోలేకపోయాం (HTTP " + res.status + ").");
    const rows = await res.json();
    state.allCandidates = rows.map(r => ({
      id: r["Name"] + "_" + r["Phone"] + "_" + r["Submitted at"],
      name: r["Name"],
      phone: r["Phone"],
      role: r["Applying for"],
      submittedAt: r["Submitted at"],
      qaLog: parseQaLog(r["Full Q&A (JSON)"]),
      aiFailureCount: 0,
      photo: r["Photo"] || "",
      copyFlag: r["Copy flag"] || "",
      styleFlag: r["Style flag"] || "",
      location: r["Location"] || "",
      finalResult: {
        overallScore: r["Overall score"],
        verdict: r["Verdict"],
        summary: r["Summary"],
        categoryScores: {
          logic: r["Logical reasoning"],
          product: r["Product knowledge"],
          sales: r["Sales aptitude"],
          situational: r["Situational judgement"],
          communication: r["Communication"]
        }
      }
    })).reverse();
    state.loadError = "";
  } catch (err) {
    console.error("Failed to load candidates", err);
    state.allCandidates = [];
    state.loadError = (err && err.message) ? err.message : "షీట్ నుండి ఫలితాలు లోడ్ చేయలేకపోయాం.";
  }
  render();
}

/* ---------------- EXCEL EXPORT ---------------- */
function exportToExcel() {
  const rows = state.allCandidates.map(c => {
    const fr = c.finalResult || {};
    const cat = fr.categoryScores || {};
    const row = {
      "Name": c.name,
      "Phone": c.phone,
      "Applying for": c.role,
      "Submitted at": c.submittedAt ? new Date(c.submittedAt).toLocaleString() : "",
      "Overall score": fr.overallScore != null ? fr.overallScore : "",
      "Verdict": fr.verdict || "",
      "Logical reasoning": cat.logic != null ? cat.logic : "",
      "Product knowledge": cat.product != null ? cat.product : "",
      "Sales aptitude": cat.sales != null ? cat.sales : "",
      "Situational judgement": cat.situational != null ? cat.situational : "",
      "Communication": cat.communication != null ? cat.communication : "",
      "Summary": fr.summary || "",
      "Integrity check": (INTEGRITY_UI[analyzeIntegrity(c.qaLog, c.copyFlag).level] || {}).short || "",
      "Paste count": analyzeIntegrity(c.qaLog, c.copyFlag).pastes,
      "Left page (count)": analyzeIntegrity(c.qaLog, c.copyFlag).leaves,
      "Total time (min)": Math.round(analyzeIntegrity(c.qaLog, c.copyFlag).totalSecs / 6) / 10
    };
    (c.qaLog || []).forEach((qa, idx) => {
      row[`Q${idx+1} (${qa.category})`] = qa.question;
      row[`A${idx+1}`] = qa.answer;
      row[`Score${idx+1}`] = qa.score;
    });
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Candidates");
  const filename = `Ramcor_EicherProX_Sales_Interviews_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

/* ---------------- UTIL ---------------- */
function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

setupIntegrityTracking();
render();
